[project]
name = "chronicle"
version = "2.0.0"
description = "Operational history and intent for agent workflows"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []          # the capture core and CLI are stdlib-only, by design

[project.optional-dependencies]
canvas = ["fastapi>=0.141.1", "starlette>=1.3.1", "uvicorn>=0.52.4"]
dev = ["pytest>=9.0.3"]

[project.scripts]
chron = "chronicle.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"chronicle.canvas" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
